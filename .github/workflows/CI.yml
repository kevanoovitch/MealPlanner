name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-tutoring-notes:
    name: No tutoring notes on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Reject the development-only tutoring handoff
        shell: bash
        run: |
          if git ls-files --error-unmatch -- TUTORING.md >/dev/null 2>&1; then
            echo "::error file=TUTORING.md::Remove TUTORING.md from the merge candidate; keep it on a development branch."
            exit 1
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting and code style
        run: dotnet format --verify-no-changes --no-restore

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

  frontend-presubmit:
    name: frontend lint and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/MealPlanner-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/MealPlanner-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: List Frontend
        run: npm run lint

      - name: Build Frotnend
        run: npm run build
