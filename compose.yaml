services:
  mealplanner:
    build: .
    image: mealplanner:local
    ports:
      - "8080:8080"
    environment:
      Database__ApplyMigrations: "true"
    volumes:
      - mealplanner-data:/data
    restart: unless-stopped

volumes:
  mealplanner-data:
    external: true
    name: mealplanner-data
